name: Build

on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: chmod +x gradlew && ./gradlew test --no-daemon

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install distribution
        run: ./gradlew installDist --no-daemon
        shell: bash
      - name: Package with jpackage
        shell: bash
        run: |
          set -euo pipefail
          jpackage --type app-image --name EM3 --app-version 0.1.0 \
            --dest build/jpackage \
            --input build/install/em3/lib \
            --main-jar em3-0.1.0.jar \
            --main-class em3.app.Em3Main
          mkdir -p build/bundle/EM3
          cp -a build/jpackage/EM3/. build/bundle/EM3/
          cp README.md CHANGELOG.md KNOWN_LIMITATIONS.md LICENSE build/bundle/EM3/
          mkdir -p build/bundle/EM3/docs
          cp docs/importing-assets.md build/bundle/EM3/docs/
          cd build/bundle
          powershell -NoProfile -Command "Compress-Archive -Path EM3 -DestinationPath ../EM3-v0.1.0-windows.zip -Force"
      - uses: actions/upload-artifact@v4
        with:
          name: EM3-v0.1.0-windows
          path: build/EM3-v0.1.0-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EM3-v0.1.0-windows
          path: dist
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'v0.1.0' && 'EM3 v0.1.0: Foundation and Salvo Preview' || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/EM3-v0.1.0-windows.zip
            README.md
            CHANGELOG.md
            KNOWN_LIMITATIONS.md
            docs/importing-assets.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
