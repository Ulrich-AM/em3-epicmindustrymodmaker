name: Build

on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: chmod +x gradlew && ./gradlew test --no-daemon

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install distribution
        run: ./gradlew installDist --no-daemon
        shell: bash
      - name: Package with jpackage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = Select-String -Path build.gradle -Pattern "^version = '([^']+)'"
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "Packaging $version"
          Get-ChildItem "build/install/em3/lib" | ForEach-Object { Write-Host $_.Name }
          $mainJar = "em3-$version.jar"
          if (-not (Test-Path "build/install/em3/lib/$mainJar")) {
            throw "Missing $mainJar"
          }
          & jpackage --type app-image --name EM3 --app-version $version `
            --verbose `
            --dest build/jpackage `
            --input "build/install/em3/lib" `
            --main-jar $mainJar `
            --main-class em3.app.Em3Main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = "build/jpackage/EM3"
          Get-ChildItem "$app/runtime" -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName }
          $exe = Join-Path $app "EM3.exe"
          if (-not (Test-Path $exe)) { throw "Missing EM3.exe" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "EM3.exe is not a Windows executable" }
          Write-Host "Verified EM3.exe ($($bytes.Length) bytes)"
          $jvm = Get-ChildItem "$app/runtime" -Recurse -Filter "jvm.dll" | Select-Object -First 1
          if ($null -eq $jvm) { throw "The jpackage runtime does not contain jvm.dll" }
          Write-Host "Verified runtime $($jvm.FullName) ($($jvm.Length) bytes)"
          $java = Join-Path $app "runtime/bin/java.exe"
          if (Test-Path $java) {
            $javaBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $java))
            if ($javaBytes[0] -ne 0x4D -or $javaBytes[1] -ne 0x5A) { throw "java.exe is not a Windows executable" }
            Write-Host "Verified $java ($($javaBytes.Length) bytes)"
          } else {
            Write-Host "runtime/bin/java.exe was not packaged; EM3.exe launches the bundled jvm.dll"
          }
          New-Item -ItemType Directory -Force -Path build/bundle/EM3/docs | Out-Null
          New-Item -ItemType Directory -Force -Path build/bundle/EM3/sprites/salvo | Out-Null
          Copy-Item -Path "$app/*" -Destination build/bundle/EM3 -Recurse -Force
          $sprites = @{
            "salvo-preview" = "core/assets-raw/sprites/blocks/turrets/salvo/salvo-preview.png"
            "salvo-barrel" = "core/assets-raw/sprites/blocks/turrets/salvo/salvo-barrel.png"
            "salvo-barrel-heat" = "core/assets-raw/sprites/blocks/turrets/salvo/salvo-barrel-heat.png"
            "salvo-side-l" = "core/assets-raw/sprites/blocks/turrets/salvo/salvo-side-l.png"
            "salvo-side-r" = "core/assets-raw/sprites/blocks/turrets/salvo/salvo-side-r.png"
            "block-2" = "core/assets-raw/sprites/blocks/turrets/bases/block-2.png"
          }
          foreach ($name in $sprites.Keys) {
            $url = "https://raw.githubusercontent.com/Anuken/Mindustry/v160.7/$($sprites[$name])"
            $dest = "build/bundle/EM3/sprites/salvo/$name.png"
            Invoke-WebRequest -Uri $url -OutFile $dest
            if ((Get-Item $dest).Length -lt 32) { throw "Sprite download looks empty: $name" }
          }
          Copy-Item README.md, CHANGELOG.md, KNOWN_LIMITATIONS.md, LICENSE, THIRD_PARTY_SPRITES.md build/bundle/EM3
          Copy-Item docs/importing-assets.md, docs/animation-and-test.md build/bundle/EM3/docs
          Compress-Archive -Path build/bundle/EM3 -DestinationPath "build/EM3-v$version-windows.zip" -Force
          if (-not (Test-Path "build/EM3-v$version-windows.zip")) { throw "Zip was not written" }
      - uses: actions/upload-artifact@v4
        with:
          name: EM3-windows
          path: build/EM3-v*-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EM3-windows
          path: dist
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to overwrite it."
            exit 1
          fi
          test -n "$(find dist -name 'EM3-v*-windows.zip' -print -quit)"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}: animation editor and interactive testing"
          body_path: CHANGELOG.md
          files: |
            dist/EM3-v*-windows.zip
            README.md
            CHANGELOG.md
            KNOWN_LIMITATIONS.md
            THIRD_PARTY_SPRITES.md
            docs/importing-assets.md
            docs/animation-and-test.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
