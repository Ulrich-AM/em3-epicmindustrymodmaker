plugins {
    id 'application'
}

group = 'dev.em3'
version = '0.2.0'

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'
def imguiVersion = '1.86.12'
def lwjglNatives = ['natives-linux', 'natives-windows', 'natives-macos', 'natives-macos-arm64']

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-tinyfd'
    lwjglNatives.each { classifier ->
        runtimeOnly "org.lwjgl:lwjgl::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-glfw::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-tinyfd::${classifier}"
    }

    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-windows:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:${imguiVersion}"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
}

application {
    mainClass = 'em3.app.Em3Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'em3.app.Em3Main'
    }
}
